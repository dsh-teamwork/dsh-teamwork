# apiEndpoint defaults to the hosted service, https://www.dshteamwork.com. Set it here for a
# self-hosted team, or pick another server in the Teamwork panel.
- insert:
    - id: dsh-teamwork
      name: '@dsh-teamwork/dsh-teamwork'
      config:
        # In the DSH home ($DSH_HOME, else ~/.dsh), wherever DSH was started; dsh-teamwork finds its socket there too.
        cachePath: !!js dshHomePath('dsh-teamwork/cache.json')
