# A tag v<version> stages @dsh-teamwork/dsh-teamwork on npm, and a maintainer approves it with
# `npm stage approve <stage-id>` (2FA). Trusted publishing (OIDC): no npm token is stored anywhere.
#
# `package` builds, tests and packs with no OIDC permission. `stage` holds the only `id-token: write`,
# runs in the protected `npm-release` environment, re-checks the tarball it was handed and stages it
# without running any package script. Set the repository variable PUBLISHING=off to stop staging.
# Setup and the release steps: README, "发布".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: vars.PUBLISHING != 'off'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only reviewed main history is released
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag names the package's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The pnpm version comes from `packageManager` in package.json; naming it here too fails the step.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The committed lib/ is what the source builds
        run: git diff --exit-code -- lib
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          test "$(ls | wc -l)" = 1
          echo "sha256=$(sha256sum *.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: npm-${{ github.sha }}
          path: ${{ runner.temp }}/package
          retention-days: 3
          if-no-files-found: error

  stage:
    needs: package
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Stage exactly the tarball that was packed, without lifecycle scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/package"
          test "$(ls | wc -l)" = 1
          echo "$EXPECTED  $(ls *.tgz)" | sha256sum --check
          npm stage publish ./*.tgz
