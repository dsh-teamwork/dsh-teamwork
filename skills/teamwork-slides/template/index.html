<!doctype html>
<!--
  A Teamwork slide deck. This file is the runtime and is never edited: the deck itself is deck.js
  (window.DECK) beside it, as the teamwork-slides skill's SKILL.md describes. Every layout is computed
  once as positioned elements on a 1280x720 canvas; the page draws them as HTML and "Export PPTX"
  draws the same elements with pptxgenjs, so the two match and the PowerPoint text stays editable.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides</title>
<style>
  :root { --bar-h: 52px; --bg: #1b1d22; --chrome: rgba(20,22,27,.92); --chrome-text: #f3f3f1; --chrome-muted: #a9abb3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #viewport { position: absolute; inset: 0 0 calc(var(--notes-h, 0px) + var(--bar-h)) 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: center center; flex: none; }
  .slide { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: hidden; display: none; }
  .slide.active { display: block; }
  .el { position: absolute; overflow: hidden; }
  .txt { white-space: pre-wrap; word-break: break-word; display: flex; flex-direction: column; }
  .txt.top { justify-content: flex-start; } .txt.middle { justify-content: center; } .txt.bottom { justify-content: flex-end; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { position: relative; padding-left: 1.1em; }
  .list li::before { content: ""; position: absolute; left: .15em; top: .62em; width: .32em; height: .32em; border-radius: 50%; background: var(--dot); }
  .list li.l2 { margin-left: 1.3em; padding-left: .9em; }
  .list li.l2::before { width: .26em; height: .26em; top: .64em; background: transparent; border: .08em solid var(--dot); }
  .list.numbered { counter-reset: n; }
  table.tbl { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
  table.tbl td, table.tbl th { padding: 0 14px; text-align: left; overflow: hidden; }
  .img { background-repeat: no-repeat; background-position: center; }
  svg text { font-family: var(--font); }

  /* The toolbar sits under the stage, where everyone finds the exports; presenting full screen, it hides until the
     pointer moves. Print never shows it. */
  #bar { position: fixed; left: 0; right: 0; bottom: var(--notes-h, 0px); height: var(--bar-h); display: flex; gap: 2px;
    align-items: center; justify-content: center; padding: 0 8px; overflow-x: auto; background: var(--bg);
    color: var(--chrome-text); font: 13px/1 system-ui, sans-serif; z-index: 10; transition: opacity .2s; }
  body.presenting { --bar-h: 0px; }
  body.presenting #bar { height: auto; left: 50%; right: auto; bottom: 16px; transform: translateX(-50%); padding: 6px;
    border-radius: 10px; background: var(--chrome); opacity: 0; }
  body.presenting.awake #bar, body.presenting #bar:focus-within { opacity: 1; }
  #bar button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 6px; color: var(--chrome-text); white-space: nowrap; }
  #bar button:hover, #bar button[aria-pressed="true"] { background: rgba(255,255,255,.14); }
  #bar .count { padding: 0 8px; color: var(--chrome-muted); font-variant-numeric: tabular-nums; }
  #bar .warn { color: #f5b049; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; height: var(--notes-h, 0px); overflow: auto; display: none;
    background: #121317; color: #e8e8e4; padding: 18px 28px; font: 20px/1.6 var(--font); border-top: 1px solid #2c2f36; }
  body.show-notes #notes { display: block; }
  #notes .label { font: 12px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-muted); margin-bottom: 10px; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--notes-h, 0px) + var(--bar-h) + 16px); transform: translateX(-50%); background: var(--chrome); color: var(--chrome-text);
    padding: 10px 16px; border-radius: 8px; font: 14px/1.4 system-ui, sans-serif; display: none; z-index: 20; max-width: 80vw; }
  body.overview #viewport { display: block; overflow: auto; padding: 24px; }
  body.overview #stage { transform: none !important; width: auto; height: auto; display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  body.overview .slide { display: block; position: relative; width: 100%; height: auto; aspect-ratio: 16 / 9; cursor: pointer; border-radius: 6px; }
  body.overview .slide > .scaler { transform-origin: 0 0; width: 1280px; height: 720px; position: absolute; left: 0; top: 0; }
  body.overview .slide.active { outline: 3px solid #f5b049; }
  .scaler { position: absolute; inset: 0; }

  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { overflow: visible; height: auto; background: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #bar, #toast, #notes { display: none !important; }
    #viewport { position: static; display: block; }
    #stage { transform: none !important; width: 1280px; height: auto; }
    .slide { display: block !important; position: relative; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .handout { display: none; }
    body.print-handout .slide, body.print-handout #stage { display: none !important; }
    body.print-handout .handout { display: block; }
  }
  @media print { body.print-handout { width: 1280px; } }
  .handout-page { width: 1280px; height: 1810px; padding: 80px 100px; break-after: page; page-break-after: always; position: relative; background: #fff; }
  .handout-page .thumb { width: 1080px; height: 607.5px; position: relative; overflow: hidden; border: 1px solid #d8d8d8; }
  .handout-page .thumb > .scaler { transform: scale(.84375); transform-origin: 0 0; width: 1280px; height: 720px; }
  .handout-page .hn { margin-top: 40px; font: 28px/1.7 var(--font); color: #222; white-space: pre-wrap; }
  .handout-page .hh { font: 20px/1 system-ui, sans-serif; color: #888; margin-bottom: 24px; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="notes"><div class="label" id="notes-label"></div><div id="notes-body"></div></div>
<div class="handout" id="handout"></div>
<div id="bar" role="toolbar">
  <button id="b-prev" aria-label="Previous">&#9664;</button>
  <span class="count" id="count"></span>
  <button id="b-next" aria-label="Next">&#9654;</button>
  <button id="b-present"></button>
  <button id="b-notes" aria-pressed="false"></button>
  <button id="b-overview" aria-pressed="false"></button>
  <button id="b-pdf"></button>
  <button id="b-handout"></button>
  <button id="b-pptx"></button>
  <button id="b-warn" class="warn" hidden></button>
</div>
<div id="toast" role="status"></div>
<script src="deck.js"></script>
<script>
"use strict";
(function () {
  var W = 1280, H = 720, PX = 96; // canvas pixels, and pixels per inch: 1280x720 is PowerPoint's 13.333x7.5 in wide layout
  var PPTX_URL = "https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js";
  var PPTX_SRI = "sha256-T7nqxc/vshPi2HQ8K3FRAl8xv7P4NMc8EgYpFtqg8/g=";

  var UI = {
    en: { present: "Present", notes: "Notes", overview: "Overview", pdf: "PDF", handout: "Notes PDF", pptx: "PPTX",
      notesLabel: "Speaker notes", noNotes: "No notes for this slide.", building: "Building the PowerPoint file…",
      built: "PowerPoint file saved.", blocked: "The download was blocked here. Open the page in its own tab and export again.",
      failed: "Export failed: ", issues: "issues", page: "Slide" },
    "zh-CN": { present: "演示", notes: "讲稿", overview: "总览", pdf: "导出 PDF", handout: "讲稿版 PDF", pptx: "导出 PPTX",
      notesLabel: "讲稿", noNotes: "这一页没有讲稿。", building: "正在生成 PowerPoint 文件…",
      built: "PowerPoint 文件已保存。", blocked: "这里拦截了下载。请在新标签页打开本页后再导出。",
      failed: "导出失败：", issues: "处问题", page: "第" }
  };

  /** Palettes as 6-digit hex without '#', as pptxgenjs takes them. dark: cover, section and closing; light: content slides. */
  var THEMES = {
    ink:    { dark: "15171C", primary: "2B3240", accent: "E3A33B", light: "F7F6F2", surface: "FFFFFF", text: "1E2128", muted: "6B6F7A", soft: "E9E6DE" },
    ocean:  { dark: "0B2340", primary: "174A7C", accent: "2FB8A6", light: "F3F6FA", surface: "FFFFFF", text: "13253A", muted: "5F6F82", soft: "DCE6F0" },
    forest: { dark: "15291F", primary: "2F5D46", accent: "D9A441", light: "F5F4EE", surface: "FFFFFF", text: "1C2A22", muted: "66705F", soft: "E2E4D7" },
    coral:  { dark: "2A2C3D", primary: "3E415C", accent: "E0735A", light: "F7F3EC", surface: "FFFFFF", text: "25273A", muted: "6E6B76", soft: "EDE5DA" },
    plum:   { dark: "24182E", primary: "4B3560", accent: "D9A066", light: "F8F5F2", surface: "FFFFFF", text: "26202C", muted: "6F6676", soft: "E8E0E6" },
    graphite: { dark: "111111", primary: "2E2E2E", accent: "E5484D", light: "F6F6F6", surface: "FFFFFF", text: "151515", muted: "6A6A6A", soft: "E4E4E4" }
  };

  var deck = window.DECK || { title: "Missing deck.js", slides: [{ layout: "cover", title: "deck.js was not found", subtitle: "Write window.DECK in deck.js beside index.html." }] };
  var lang = /^zh/i.test(deck.lang || "") ? "zh-CN" : "en";
  var t = UI[lang];
  var zh = lang === "zh-CN";
  var theme = Object.assign({}, THEMES[deck.theme] || THEMES.ink, clean(deck.colors));
  var FONT_CSS = zh ? '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif'
                    : '"Segoe UI",Calibri,"Helvetica Neue",Arial,sans-serif';
  var FONT_PPT = zh ? "Microsoft YaHei" : "Calibri";
  document.documentElement.lang = lang;
  document.documentElement.style.setProperty("--font", FONT_CSS);
  document.title = deck.title || "Slides";

  function clean(colors) {
    var out = {};
    for (var k in (colors || {})) { var v = String(colors[k]).replace(/^#/, ""); if (/^[0-9a-fA-F]{6}$/.test(v)) out[k] = v.toUpperCase(); }
    return out;
  }
  function c(hex) { return "#" + hex; }
  function str(v) { return v == null ? "" : String(v); }
  function arr(v) { return Array.isArray(v) ? v : v == null ? [] : [v]; }

  /* checks:start: check.mjs beside the skill runs this block on its own, so it uses nothing outside it. */
  /** The problems a deck has that its words alone show: what a layout would cut off, an unknown layout, missing notes, too much text. */
  function checkDeck(deck) {
    var LAYOUT_NAMES = ["cover", "agenda", "section", "bullets", "two-column", "stats", "quote", "chart", "process", "table", "compare", "image", "closing"];
    var LIMITS = { agenda: ["items", 6], stats: ["stats", 4], process: ["steps", 5], table: ["rows", 8], compare: ["rows", 8] };
    var zh = /^zh/i.test(String(deck && deck.lang || ""));
    var out = [];
    function s(v) { return v == null ? "" : String(v); }
    function list(v) { return Array.isArray(v) ? v : v == null ? [] : [v]; }
    function lines(v) {
      var o = [];
      list(v).forEach(function (b) { if (b && typeof b === "object") { o.push(s(b.text)); list(b.sub).forEach(function (x) { o.push(s(x)); }); } else o.push(s(b)); });
      return o;
    }
    // A Chinese character is about two Latin ones wide.
    function width(text) { var n = 0; for (var ch of s(text)) n += /[\u2e80-\u9fff\uff00-\uffef]/.test(ch) ? 2 : 1; return n; }
    if (!deck || !Array.isArray(deck.slides) || !deck.slides.length) return ["deck.js sets no window.DECK.slides"];
    deck.slides.forEach(function (sl, i) {
      var at = (i + 1) + ": ";
      sl = sl || {};
      if (LAYOUT_NAMES.indexOf(sl.layout) < 0) { out.push(at + "unknown layout \"" + sl.layout + "\""); return; }
      var lim = LIMITS[sl.layout];
      if (lim && list(sl[lim[0]]).length > lim[1]) out.push(at + sl.layout + " shows at most " + lim[1] + " " + lim[0] + "; the rest are cut off");
      var bl = lines(sl.bullets).concat(lines((sl.left || {}).bullets), lines((sl.right || {}).bullets));
      if (bl.length > 6) out.push(at + bl.length + " bullet lines; split the slide (at most 6)");
      var long = bl.filter(function (b) { return width(b) > 72; }).length;
      if (long) out.push(at + long + " bullet" + (long > 1 ? "s are" : " is") + " long; keep each under about 36 Chinese or 70 Latin characters");
      if (width(sl.title) > 72) out.push(at + "title is long; say the takeaway in fewer words");
      list(sl.stats).forEach(function (st) { if (width(st && st.value) > 8) out.push(at + "stat value \"" + s(st && st.value) + "\" is long; keep the number short and put words in its label"); });
      if (sl.chart) {
        var cats = list(sl.chart.categories).length, ser = list(sl.chart.series);
        if (cats > 8) out.push(at + "chart has " + cats + " categories (at most 8)");
        if (ser.length > 3) out.push(at + "chart has " + ser.length + " series (at most 3)");
        ser.forEach(function (x) { if (list(x && x.values).length !== cats) out.push(at + "chart series \"" + s(x && x.name) + "\" has " + list(x && x.values).length + " values for " + cats + " categories"); });
      }
      if (!s(sl.notes).trim()) out.push(at + "no speaker notes");
    });
    return out;
  }
  /* checks:end */

  // ---- Layouts: each returns { bg, els } on the 1280x720 canvas -------------------------------------------------
  // An element is one of:
  //   { k:"rect", x,y,w,h, fill, r }                                   r: corner radius in px
  //   { k:"oval", x,y,w,h, fill }
  //   { k:"text", x,y,w,h, text, size, color, bold, align, valign, min, lh, track }
  //   { k:"list", x,y,w,h, items:[{text, level}], size, color, dot, gap, min, numbered }
  //   { k:"chart", x,y,w,h, chart }  { k:"table", x,y,w,h, columns, rows, size }  { k:"image", x,y,w,h, src, fit }
  // size is in canvas px (PowerPoint points are 0.75 of it); min is the smallest size fitting may shrink to.

  var M = 72;          // side margin
  var TITLE_Y = 52, TITLE_H = 92, BODY_Y = 168, BODY_B = 640;

  function chrome(s, i, n) {
    return [
      { k: "text", x: M, y: 664, w: 760, h: 28, text: str(deck.footer != null ? deck.footer : deck.title), size: 14, color: theme.muted, valign: "middle" },
      { k: "text", x: W - M - 160, y: 664, w: 160, h: 28, text: (i + 1) + " / " + n, size: 14, color: theme.muted, align: "right", valign: "middle" }
    ];
  }
  function title(s) {
    return { k: "text", x: M, y: TITLE_Y, w: W - 2 * M, h: TITLE_H, text: str(s.title), size: 40, min: 28, bold: true, color: theme.text, valign: "bottom", lh: 1.2 };
  }
  function items(list) {
    var out = [];
    arr(list).forEach(function (b) {
      if (b && typeof b === "object") {
        out.push({ text: str(b.text), level: 1 });
        arr(b.sub).forEach(function (x) { out.push({ text: str(x), level: 2 }); });
      } else out.push({ text: str(b), level: 1 });
    });
    return out;
  }

  var LAYOUTS = {
    cover: function (s) {
      var els = [
        { k: "text", x: 112, y: 150, w: 1000, h: 40, text: str(s.kicker), size: 20, color: theme.accent, bold: true, track: 2 },
        { k: "text", x: 112, y: 196, w: 1050, h: 250, text: str(s.title), size: 64, min: 40, bold: true, color: "FFFFFF", valign: "middle", lh: 1.15 },
        { k: "text", x: 112, y: 456, w: 1000, h: 100, text: str(s.subtitle), size: 26, min: 18, color: "D9DAD6", lh: 1.4 },
        { k: "text", x: 112, y: 600, w: 1000, h: 40, text: str(s.meta), size: 18, color: "A9ABAF", valign: "middle" }
      ];
      return { bg: theme.dark, dark: true, els: els };
    },
    section: function (s, i) {
      return { bg: theme.primary, dark: true, els: [
        { k: "text", x: M, y: 170, w: 400, h: 150, text: str(s.kicker != null ? s.kicker : ""), size: 120, bold: true, color: theme.accent, valign: "bottom", lh: 1.05 },
        { k: "text", x: M, y: 340, w: 1000, h: 150, text: str(s.title), size: 54, min: 36, bold: true, color: "FFFFFF", lh: 1.2 },
        { k: "text", x: M, y: 500, w: 1000, h: 100, text: str(s.subtitle), size: 24, min: 18, color: "D9DAD6", lh: 1.4 }
      ] };
    },
    agenda: function (s) {
      var list = arr(s.items).slice(0, 6), els = [title(s)];
      var rowH = Math.min(84, (BODY_B - BODY_Y) / Math.max(list.length, 1));
      list.forEach(function (it, j) {
        var y = BODY_Y + 8 + j * rowH;
        els.push({ k: "text", x: M, y: y, w: 90, h: rowH - 12, text: String(j + 1).padStart(2, "0"), size: 32, bold: true, color: theme.accent, valign: "middle" });
        els.push({ k: "rect", x: M + 96, y: y + rowH - 13, w: W - 2 * M - 96, h: 1, fill: theme.soft });
        els.push({ k: "text", x: M + 96, y: y, w: W - 2 * M - 96, h: rowH - 12, text: str(it && it.text || it), size: 28, min: 20, color: theme.text, valign: "middle" });
      });
      return { bg: theme.light, els: els };
    },
    bullets: function (s) {
      var els = [title(s)], aside = s.aside;
      var w = aside ? 690 : W - 2 * M;
      els.push({ k: "list", x: M, y: BODY_Y + 12, w: w, h: BODY_B - BODY_Y - 12, items: items(s.bullets), size: 30, min: 20, color: theme.text, dot: theme.accent, gap: 0.6 });
      if (aside) {
        var ax = M + w + 48, aw = W - M - ax;
        els.push({ k: "rect", x: ax, y: BODY_Y + 12, w: aw, h: 340, fill: theme.primary, r: 14 });
        els.push({ k: "text", x: ax + 32, y: BODY_Y + 44, w: aw - 64, h: 130, text: str(aside.value), size: 76, min: 40, bold: true, color: theme.accent, valign: "bottom", lh: 1.05 });
        els.push({ k: "text", x: ax + 32, y: BODY_Y + 190, w: aw - 64, h: 140, text: str(aside.label), size: 22, min: 15, color: "FFFFFF", lh: 1.45 });
      }
      return { bg: theme.light, els: els };
    },
    "two-column": function (s) {
      var els = [title(s)], colW = (W - 2 * M - 40) / 2;
      var rows = Math.max(items((s.left || {}).bullets).length, items((s.right || {}).bullets).length);
      var cardH = Math.max(280, Math.min(452, 130 + rows * 62));
      [s.left || {}, s.right || {}].forEach(function (col, j) {
        var x = M + j * (colW + 40);
        els.push({ k: "rect", x: x, y: BODY_Y + 8, w: colW, h: cardH, fill: theme.surface, r: 14 });
        els.push({ k: "text", x: x + 32, y: BODY_Y + 34, w: colW - 64, h: 56, text: str(col.heading), size: 28, min: 20, bold: true, color: j ? theme.primary : theme.text, valign: "middle" });
        els.push({ k: "list", x: x + 32, y: BODY_Y + 100, w: colW - 64, h: cardH - 112, items: items(col.bullets), size: 22, min: 16, color: theme.text, dot: j ? theme.primary : theme.accent, gap: 0.55 });
      });
      return { bg: theme.light, els: els };
    },
    stats: function (s) {
      var els = [title(s)], list = arr(s.stats).slice(0, 4), n = Math.max(list.length, 1), gap = 32;
      var cw = (W - 2 * M - gap * (n - 1)) / n;
      list.forEach(function (st, j) {
        var x = M + j * (cw + gap), y = BODY_Y + 30;
        els.push({ k: "rect", x: x, y: y, w: cw, h: 380, fill: theme.surface, r: 14 });
        els.push({ k: "text", x: x + 28, y: y + 36, w: cw - 56, h: 130, text: str(st.value), size: n > 3 ? 64 : 80, min: 36, bold: true, color: j === 0 ? theme.accent : theme.primary, valign: "bottom", lh: 1.05 });
        els.push({ k: "text", x: x + 28, y: y + 190, w: cw - 56, h: 80, text: str(st.label), size: 24, min: 16, bold: true, color: theme.text, lh: 1.3 });
        els.push({ k: "text", x: x + 28, y: y + 282, w: cw - 56, h: 84, text: str(st.note), size: 17, min: 13, color: theme.muted, lh: 1.4 });
      });
      if (s.takeaway) els.push({ k: "text", x: M, y: BODY_Y + 430, w: W - 2 * M, h: 50, text: str(s.takeaway), size: 22, min: 16, color: theme.muted, valign: "middle" });
      return { bg: theme.light, els: els };
    },
    quote: function (s) {
      return { bg: theme.light, els: [
        { k: "text", x: M + 20, y: 40, w: 220, h: 260, text: "“", size: 220, bold: true, color: theme.accent, lh: 1.05 },
        { k: "text", x: 180, y: 190, w: 920, h: 300, text: str(s.quote), size: 42, min: 26, bold: true, color: theme.text, valign: "middle", lh: 1.4 },
        { k: "text", x: 180, y: 510, w: 920, h: 60, text: s.by ? "— " + s.by : "", size: 22, min: 16, color: theme.muted, valign: "middle" }
      ] };
    },
    chart: function (s) {
      var els = [title(s)], side = s.takeaway != null;
      var cw = side ? 790 : W - 2 * M;
      els.push({ k: "rect", x: M, y: BODY_Y + 4, w: cw, h: 464, fill: theme.surface, r: 14 });
      els.push({ k: "chart", x: M + 20, y: BODY_Y + 20, w: cw - 40, h: 432, chart: s.chart || {} });
      if (side) {
        var ax = M + cw + 32, aw = W - M - ax;

          var hl = r && el.highlight === ci;
          return { text: str(cell), options: { bold: !r || !ci || hl, color: r ? theme.text : "FFFFFF",
            fill: { color: r ? (hl ? theme.soft : r % 2 ? theme.surface : theme.light) : theme.primary } } };
        });
      });
      slide.addTable(rows, Object.assign({}, pos, { fontFace: FONT_PPT, fontSize: pt(el.size), valign: "middle", margin: [0, 0.14, 0, 0.14],
        border: { type: "solid", pt: 0.75, color: theme.soft }, rowH: inch(el.h / rows.length),
        colW: rows[0].map(function () { return inch(el.w / rows[0].length); }) }));
    } else if (el.k === "image") {
      var img = await imageData(el.src);
      if (!img) { slide.addShape(pptx.ShapeType.rect, Object.assign({}, pos, { fill: { color: theme.soft }, line: { color: theme.soft } })); return; }
      slide.addImage(Object.assign({ data: img.data }, pos, { sizing: { type: el.fit === "cover" ? "cover" : "contain", w: pos.w, h: pos.h } }));
    } else if (el.k === "chart") {
      var ch = el.chart, type = ch.type || "bar", cats = arr(ch.categories).map(str);
      var data = series(ch).map(function (s) { return { name: s.name, labels: cats, values: s.values }; });
      var round = type === "pie" || type === "doughnut", range = axis(ch, series(ch));
      slide.addChart(round ? (type === "pie" ? pptx.ChartType.pie : pptx.ChartType.doughnut) : type === "line" ? pptx.ChartType.line : pptx.ChartType.bar,
        round ? data.slice(0, 1) : data, Object.assign({}, pos, {
          chartColors: round ? palette().slice(0, Math.max(cats.length, 1)) : palette().slice(0, data.length),
          showValue: !round, showPercent: round, showLegend: round || data.length > 1, legendPos: "b", legendFontSize: 11, legendFontFace: FONT_PPT,
          showTitle: !!ch.title, title: str(ch.title), titleFontSize: 14, titleColor: theme.text, titleFontFace: FONT_PPT,
          dataLabelColor: round ? "FFFFFF" : theme.text, dataLabelFontSize: 11, dataLabelFontFace: FONT_PPT, dataLabelPosition: round ? "ctr" : "outEnd",
          catAxisLabelColor: theme.text, catAxisLabelFontSize: 12, catAxisLabelFontFace: FONT_PPT,
          valAxisLabelColor: theme.muted, valAxisLabelFontSize: 11, valGridLine: { color: theme.soft, size: 0.75 }, catGridLine: { style: "none" },
          valAxisMinVal: round ? undefined : range.min, valAxisMaxVal: round ? undefined : range.max,
          valAxisMajorUnit: round ? undefined : (range.max - range.min) / 4,
          barGapWidthPct: 60, lineSize: 3, lineDataSymbolSize: 9, holeSize: 55,
          dataLabelFormatCode: round ? "0%" : ch.unit === "%" ? "0\"%\"" : "#,##0.##",
          valAxisLabelFormatCode: ch.unit === "%" ? "0\"%\"" : "#,##0.##"
        }));
    }
  }

  // ---- Wiring ---------------------------------------------------------------------------------------------------
  [["b-present", t.present], ["b-notes", t.notes], ["b-overview", t.overview], ["b-pdf", t.pdf], ["b-handout", t.handout], ["b-pptx", t.pptx]]
    .forEach(function (p) { document.getElementById(p[0]).textContent = p[1]; });
  document.getElementById("notes-label").textContent = t.notesLabel;
  document.getElementById("b-prev").onclick = function () { go(cur - 1); };
  document.getElementById("b-next").onclick = function () { go(cur + 1); };
  document.getElementById("b-present").onclick = function () {
    var el = document.documentElement; (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(function () {});
  };
  document.getElementById("b-notes").onclick = function () { toggle("show-notes"); };
  document.getElementById("b-notes").id = "b-show-notes";
  document.getElementById("b-overview").onclick = function () { toggle("overview"); };
  document.getElementById("b-pdf").onclick = printSlides;
  document.getElementById("b-handout").onclick = printHandout;
  document.getElementById("b-pptx").onclick = function () {
    exportPptx().catch(function (e) { toast(t.failed + (e && e.message || e), 9000); });
  };
  // For a check without a screen: a headless browser's --dump-dom shows the problems on <body data-issues>.
  document.body.setAttribute("data-issues", JSON.stringify(issues));
  if (issues.length) {
    var w = document.getElementById("b-warn"); w.hidden = false; w.textContent = "⚠ " + issues.length + " " + t.issues;
    w.title = issues.join("\n"); w.onclick = function () { toast(issues.join("  |  "), 12000); };
    if (window.console) console.warn("Deck issues:\n" + issues.join("\n"));
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") { go(cur + 1); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { go(cur - 1); e.preventDefault(); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "n" || k === "N") toggle("show-notes");
    else if (k === "o" || k === "O" || k === "Escape" && document.body.classList.contains("overview")) toggle("overview");
    else if (k === "f" || k === "F") document.getElementById("b-present").click();
  });
  var touchX = null;
  document.addEventListener("touchstart", function (e) { document.body.classList.add("touch"); touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX == null) return; var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  window.addEventListener("resize", scale);
  document.addEventListener("fullscreenchange", function () {
    document.body.classList.toggle("presenting", !!document.fullscreenElement); requestAnimationFrame(scale);
  });
  var sleep;
  document.addEventListener("mousemove", function () {
    document.body.classList.add("awake"); clearTimeout(sleep);
    sleep = setTimeout(function () { document.body.classList.remove("awake"); }, 2500);
  });
  window.addEventListener("hashchange", function () { var n = parseInt(location.hash.slice(1), 10); if (n) go(n - 1); });
  window.SLIDES = { issues: issues, plans: plans, go: go, exportPptx: exportPptx };
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
  scale();
})();
</script>
</body>
